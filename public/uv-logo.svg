<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <style>
      .bg-pink { fill: #e91e63; }
      .bg-purple { fill: #3b2c85; }
      .text-purple { fill: #3b2c85; font-family: 'Arial Black', sans-serif; font-weight: 900; }
      .text-pink-banner { fill: #ffffff; font-family: 'Arial Black', sans-serif; font-weight: 900; }
      .text-motto { fill: #1e1b4b; font-family: 'Georgia', serif; font-weight: bold; }
    </style>
  </defs>

  <!-- Left Circular Badge & Wings Group -->
  <g transform="translate(140, 120)">
    <!-- Side Wings (Left & Right Horizontal Layered Bars) -->
    <path d="M-130,-30 L-70,-30 L-65,0 L-130,-30 Z" fill="#9c27b0" />
    <path d="M-135,-10 L-62,-10 L-60,15 L-135,-10 Z" fill="#3b2c85" />
    <path d="M-125,12 L-58,15 L-60,35 L-125,12 Z" fill="#e91e63" />

    <path d="M130,-30 L70,-30 L65,0 L130,-30 Z" fill="#9c27b0" />
    <path d="M135,-10 L62,-10 L60,15 L135,-10 Z" fill="#3b2c85" />
    <path d="M125,12 L58,15 L60,35 L125,12 Z" fill="#e91e63" />

    <!-- Outer Pink Circle Ring -->
    <circle cx="0" cy="0" r="95" fill="none" stroke="#e91e63" stroke-width="14" />

    <!-- White Inner Circle -->
    <circle cx="0" cy="0" r="82" fill="#ffffff" />

    <!-- Top Icons: Fork, Spoon, Chef Hat, Cocktail Glass -->
    <g fill="#9c27b0" stroke="#9c27b0" stroke-width="0.5" transform="translate(0, -48) scale(0.75)">
      <!-- Fork & Spoon -->
      <path d="M-45,0 L-45,12 M-48,0 L-48,8 M-42,0 L-42,8 M-45,12 C-48,15 -48,20 -45,25 L-45,40" fill="none" stroke="#9c27b0" stroke-width="2"/>
      <!-- Chef Hat -->
      <path d="M-15,10 C-20,0 -10,-15 0,-15 C10,-15 20,0 15,10 C20,15 15,25 10,25 L-10,25 C-15,25 -20,15 -15,10 Z" fill="none" stroke="#9c27b0" stroke-width="2.5"/>
      <path d="M-10,25 L10,25 L10,32 L-10,32 Z" fill="#9c27b0" />
      <!-- Cocktail Glass -->
      <path d="M35,0 L50,0 L42.5,15 L42.5,35 M36,35 L49,35" fill="none" stroke="#9c27b0" stroke-width="2"/>
      <circle cx="47" cy="-2" r="3" fill="#e91e63" stroke="none" />
    </g>

    <!-- Center UV Monogram -->
    <text x="0" y="18" text-anchor="middle" font-family="'Times New Roman', serif" font-weight="bold" font-size="52" fill="#3b2c85" letter-spacing="2">UV</text>

    <!-- Bottom 3 Stars -->
    <g fill="#3b2c85" transform="translate(0, 48)">
      <polygon points="0,-7 2,-2 7,-2 3,1 5,6 0,3 -5,6 -3,1 -7,-2 -2,-2" transform="scale(1.2)" />
      <polygon points="-22,-5 -20,-1 -15,-1 -19,2 -17,6 -22,3 -27,6 -25,2 -29,-1 -24,-1" transform="scale(0.9)" />
      <polygon points="22,-5 24,-1 29,-1 25,2 27,6 22,3 17,6 19,2 15,-1 20,-1" transform="scale(0.9)" />
    </g>
  </g>

  <!-- Right Branding Text -->
  <!-- "UV COLLEGE" -->
  <text x="320" y="90" font-family="'Impact', 'Arial Black', sans-serif" font-size="76" font-weight="900" fill="#3b2c85" letter-spacing="1">UV COLLEGE</text>

  <!-- "OF HOTEL MANAGEMENT" Magenta Banner -->
  <rect x="312" y="112" width="560" height="52" rx="4" fill="#e91e63" />
  <text x="592" y="150" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="36" font-weight="900" fill="#ffffff" letter-spacing="2">OF HOTEL MANAGEMENT</text>

  <!-- Tagline "Building Careers Bringing Excellence" -->
  <text x="592" y="194" text-anchor="middle" font-family="'Trebuchet MS', sans-serif" font-size="22" font-weight="bold" fill="#1e1b4b" letter-spacing="0.5">Building Careers Bringing Excellence</text>
</svg>
